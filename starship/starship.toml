"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$username\
[](bg:color_bg3 fg:color_bg4)\
$directory\
[](fg:color_bg3 bg:color_bg2)\
$git_branch\
$git_status\
[](fg:color_bg2 bg:color_bg1)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_bg1 bg:color_bg1)\
$docker_context\
$conda\
$pixi\
[ ](fg:color_bg1)\
$line_break$character"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_fg1 = '#ebdbb2'
color_fg4 = '#a89984'
color_bg4 = '#7c6f64'
color_bg3 = '#665c54'
color_bg2 = '#504945'
color_bg1 = '#3c3836'
color_bg0s = '#32302f'

[os]
disabled = false
format = '[ $symbol]($style)'
style = "bg:color_bg4 fg:color_fg0"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = ""
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:color_bg4 fg:color_fg0"
style_root = "bg:color_bg4 fg:color_fg0"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg0 bg:color_bg3"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_bg2"
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_bg2)]($style)'

[git_status]
style = "bg:color_bg2"
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_bg2)]($style)'

[nodejs]
symbol = ""
style = "bg:color_bg1"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_bg1)]($style)'

[bun]
symbol = ""
style = "bg:color_bg1"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_bg1)]($style)'

[c]
symbol = " "
style = "bg:color_bg1"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_bg1)]($style)'

[cpp]
symbol = " "
style = "bg:color_bg1"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_bg1)]($style)'

[rust]
symbol = ""
style = "bg:color_bg1"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_bg1)]($style)'

[golang]
symbol = ""
style = "bg:color_bg1"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_bg1)]($style)'

[php]
symbol = ""
style = "bg:color_bg1"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_bg1)]($style)'

[java]
symbol = ""
style = "bg:color_bg1"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_bg1)]($style)'

[kotlin]
symbol = ""
style = "bg:color_bg1"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_bg1)]($style)'

[haskell]
symbol = ""
style = "bg:color_bg1"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_bg1)]($style)'

[python]
symbol = ""
style = "bg:color_bg1"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_bg1)]($style)'

[docker_context]
symbol = ""
style = "bg:color_bg1"
format = '[[ $symbol( $context) ](fg:color_fg1 bg:color_bg1)]($style)'

[conda]
style = "bg:color_bg1"
format = '[[ $symbol( $environment) ](fg:color_fg1 bg:color_bg1)]($style)'

[pixi]
style = "bg:color_bg1"
format = '[[ $symbol( $version)( $environment) ](fg:color_fg0 bg:color_bg1)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg0s"
format = '[[  $time ](fg:color_fg0 bg:color_bg0s)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_fg0)'
error_symbol = '[](bold fg:color_fg4)'
vimcmd_symbol = '[](bold fg:color_fg0)'
vimcmd_replace_one_symbol = '[](bold fg:color_fg4)'
vimcmd_replace_symbol = '[](bold fg:color_fg4)'
vimcmd_visual_symbol = '[](bold fg:color_bg3)'
