# Prefix: Cmd+A (Ghostty sends Ctrl-A for Cmd+A; see ~/.config/ghostty/config)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g status-position top

# Windows/panes numbered from 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Splits: " stacks panes (horizontal line), | puts them side by side
unbind %
bind '"' split-window -v -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"

# Resize active pane with Ctrl+Shift+arrow (no prefix needed)
bind -n C-S-Left  resize-pane -L 5
bind -n C-S-Right resize-pane -R 5
bind -n C-S-Up    resize-pane -U 5
bind -n C-S-Down  resize-pane -D 5

# Mouse: click to focus panes/windows, drag borders to resize, scroll history
set -g mouse on
set -g repeat-time 1000

# Arrows resize (prefix, then arrow; repeatable: keep tapping arrows within 1s)
# Pane focus moves to h/j/k/l (or just click).
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up    resize-pane -U 5
bind -r Down  resize-pane -D 5
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

# Gruvbox (morhetz) bg/fg shades only, no accent colors.
# Prefix indicator: when C-a is armed the session block inverts (light on dark
# -> dark on light) and the bar darkens. Must stay after the tpm line (the theme
# sets these at load). Spaces, not commas, inside #[] so the conditional holds.
set -g status-left "#{?client_prefix,#[bg=#ebdbb2 fg=#282828 bold] #S #[bg=#282828 fg=#ebdbb2 nobold],#[bg=#665c54 fg=#bdae93] #S #[bg=#3c3836 fg=#665c54 nobold noitalics nounderscore]}"
set -g status-style "#{?client_prefix,bg=#282828 fg=#ebdbb2,bg=#3c3836 fg=#ebdbb2}"

# Active window tab: lighter bg shade than inactive tabs
set -g window-status-current-style "bg=#7c6f64 fg=#fbf1c7"
set -g window-status-current-format "#[bg=#7c6f64 fg=#3c3836 nobold noitalics nounderscore]#[bg=#7c6f64 fg=#fbf1c7] #I #[bg=#7c6f64 fg=#fbf1c7 bold] #W#{?window_zoomed_flag,*Z,} #[bg=#3c3836 fg=#7c6f64 nobold noitalics nounderscore]"
